name: kinvo

services:
  postgres:
    # PostGIS is required from Batch 1 for radius queries on the Discover deck
    # (spec 2). The plain postgres image will not do.
    image: postgis/postgis:16-3.4
    container_name: kinvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinvo
      POSTGRES_PASSWORD: kinvo
      POSTGRES_DB: kinvo_dev
    ports:
      # Non-default host port so this never collides with a local Postgres.
      - '5433:5432'
    volumes:
      - kinvo_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kinvo -d kinvo_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kinvo-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - kinvo_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kinvo_postgres_data:
  kinvo_redis_data:
